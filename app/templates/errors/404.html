<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div style="font-size: 4rem; font-weight: 800; color: #6366f1; line-height: 1; margin-bottom: 1rem;">404</div>
      <h1 class="auth-title" style="margin-bottom: 0.5rem;">Page Not Found</h1>
      <p class="auth-subtitle" style="margin-bottom: 1.5rem;">The page or financial record you are looking for does not exist or has been relocated.</p>
      
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="display: inline-flex; width: 100%;">
        <i data-lucide="home"></i>
        <span>Return to Dashboard</span>
      </a>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
